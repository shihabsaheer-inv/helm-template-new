# ========================================
# Development Environment Overrides
# ========================================
global:
    environment: prod
# ========================================
# Image Configuration
# Always pull the latest image for quick dev iterations
# ========================================
image:
    repository: nginx
    tag: latest
    pullPolicy: Always
# ========================================
# Service Configuration
# Use NodePort for easy local/external access in development
# ========================================
service:
    type: NodePort
    port: 80
    targetPort: 80
# ========================================
# ConfigMap Configuration
# Disabled for dev — can be enabled when config files are needed
# ========================================
config:
    enabled: false
    mountAsFiles: true
    items:
        - key: ENC[AES256_GCM,data:37fUYyeAgxZ4r3Y=,iv:PkuMpLzQL7Z5pWTHwuWCAXpulLHff63VYNzpQId0/F0=,tag:tS591UcXx9+RY8kF+gPCEA==,type:str]
          path: app-config.json
        - key: ENC[AES256_GCM,data:eLavwGdEj0d9jpg=,iv:gFZMjuvKK1Nkvp19op99rpxvt9sMguflLk1mC3GkcWk=,tag:dETzhdY2+0gwgzh37P1Fbg==,type:str]
          path: app-config.yaml
        - key: ENC[AES256_GCM,data:gMHRiFjRf5mcFVmi5M/VrujddHZRpg==,iv:WnwlJulVWWlidhbCaAUMU7GOLysVx7N9MZwz3kwDIsE=,tag:BjxnVNWDjc/ZPQVo8d4VWg==,type:str]
          path: application.properties
# ========================================
# Secrets Configuration
# Disabled for dev — avoids secret mounting during local testing
# ========================================
secrets:
    enabled: ENC[AES256_GCM,data:ucl8Fyc=,iv:sM+n41ULRLxXVTpektmJcLI9HxR9EDFsB9cgZ5fn+7A=,tag:Z+WLPb8oh7IGUURGrPaXOg==,type:bool]
    mountAsFiles: ENC[AES256_GCM,data:LOzIlQ==,iv:iWvHEWmmcnp2CTZdrR34Un7PzXJdZYt9IbGbHi39C/8=,tag:NUInuNkEbnPg5awGxgVjPA==,type:bool]
    items:
        - key: ENC[AES256_GCM,data:A01bf/4aU8CU1iVr,iv:qKegD7JiN1McNIT64EIvwgO6jrhfnzNu80yxxn0WcLY=,tag:mCMftiJDc1O8z4H6AhzCeQ==,type:str]
          path: ENC[AES256_GCM,data:0DD2cGXNB0HLKyu8FP6GTA==,iv:0vZZl21IGxIVVZtJuwJWuakpcqlM0gT600/yQ5c84rA=,tag:lvGApzNtVazDPz6LpPxFcA==,type:str]
