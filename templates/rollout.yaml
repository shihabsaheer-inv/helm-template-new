{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "mychart.fullname" . }}-rollout
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mychart.selectorLabels" . | nindent 8 }}
    spec:
      {{- /* Define reusable flags for config and secret handling */ -}}
      {{- $configMount := and .Values.config.enabled .Values.config.mountAsFiles }}
      {{- $secretMount := and .Values.secrets.enabled .Values.secrets.mountAsFiles }}
      {{- $envConfig := and .Values.config.enabled (not .Values.config.mountAsFiles) }}
      {{- $envSecret := and .Values.secrets.enabled (not .Values.secrets.mountAsFiles) }}

      containers:
        - name: {{ include "mychart.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}

          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          {{- with .Values.probes.readiness }}
          {{- if and .enabled .path }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.liveness }}
          {{- if and .enabled .path }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.service.targetPort }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          {{- if or $envConfig $envSecret }}
          envFrom:
            {{- if $envConfig }}
            - configMapRef:
                name: {{ include "mychart.fullname" . }}-config
            {{- end }}
            {{- if $envSecret }}
            - secretRef:
                name: {{ include "mychart.fullname" . }}-secret
            {{- end }}
          {{- end }}

          volumeMounts:
            {{- if $configMount }}
            - name: config-volume
              mountPath: {{ .Values.config.mountPath | default "/etc/config" }}
              readOnly: true
            {{- end }}

            {{- if $secretMount }}
            - name: secrets-volume
              mountPath: {{ .Values.secrets.mountPath | default "/etc/secrets" }}
              readOnly: true
            {{- end }}

      volumes:
        {{- if $configMount }}
        - name: config-volume
          configMap:
            name: {{ include "mychart.fullname" . }}-config
            items:
              {{- $env := .Values.global.environment | default "default" }}
              {{- $jsonFile := printf "config/%s.json" $env }}
              {{- if .Files.Get $jsonFile }}
              - key: config.json
                path: config.json
              {{- else if .Files.Get "config/default.json" }}
              - key: config.json
                path: config.json
              {{- end }}

              {{- $yamlFile := printf "config/%s.yaml" $env }}
              {{- if .Files.Get $yamlFile }}
              - key: config.yaml
                path: config.yaml
              {{- else if .Files.Get "config/default.yaml" }}
              - key: config.yaml
                path: config.yaml
              {{- end }}

              {{- $propsFile := printf "config/application-%s.properties" $env }}
              {{- if .Files.Get $propsFile }}
              - key: application.properties
                path: application.properties
              {{- else if .Files.Get "config/application.properties" }}
              - key: application.properties
                path: application.properties
              {{- end }}
        {{- end }}

        {{- if $secretMount }}
        - name: secrets-volume
          secret:
            secretName: {{ include "mychart.fullname" . }}-secret
            {{- if .Values.secrets.items }}
            items:
              {{- range .Values.secrets.items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
            {{- end }}
        {{- end }}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
{{- end }}
