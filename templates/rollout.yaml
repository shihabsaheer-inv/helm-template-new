{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "mychart.fullname" . }}-rollout
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mychart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "mychart.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          {{- if and .Values.probes.readiness.enabled .Values.probes.readiness.path }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if and .Values.probes.liveness.enabled .Values.probes.liveness.path }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if or (and .Values.config.enabled (not .Values.config.mountAsFiles)) (and .Values.secrets.enabled (not .Values.secrets.mountAsFiles)) }}
          envFrom:
            {{- if and .Values.config.enabled (not .Values.config.mountAsFiles) }}
            - configMapRef:
                name: {{ include "mychart.fullname" . }}-config
            {{- end }}
            {{- if and .Values.secrets.enabled (not .Values.secrets.mountAsFiles) }}
            - secretRef:
                name: {{ include "mychart.fullname" . }}-secret
            {{- end }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.secrets.enabled .Values.secrets.mountAsFiles }}
            - name: secrets-volume
              mountPath: {{ .Values.secrets.mountPath | default "/etc/secrets" }}
              readOnly: true
            {{- end }}
            {{- if and .Values.config.enabled .Values.config.mountAsFiles }}
            - name: config-volume
              mountPath: {{ .Values.config.mountPath | default "/etc/config" }}
              readOnly: true
            {{- end }}
            {{- if .Values.volumes.secrets.enabled }}
            - name: {{ .Values.volumes.secrets.name }}
              mountPath: {{ .Values.volumes.secrets.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.volumes.config.enabled }}
            - name: {{ .Values.volumes.config.name }}
              mountPath: {{ .Values.volumes.config.mountPath }}
              readOnly: {{ .Values.volumes.config.readOnly | default true }}
            {{- end }}
      volumes:
        {{- if and .Values.secrets.enabled .Values.secrets.mountAsFiles }}
        - name: secrets-volume
          secret:
            secretName: {{ include "mychart.fullname" . }}-secret
            {{- if .Values.secrets.items }}
            items:
              {{- range .Values.secrets.items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
            {{- end }}
        {{- end }}
        {{- if and .Values.config.enabled .Values.config.mountAsFiles }}
        - name: config-volume
          configMap:
            name: {{ include "mychart.fullname" . }}-config
            {{- if .Values.config.items }}
            items:
              {{- range .Values.config.items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
            {{- end }}
        {{- end }}
        {{- if .Values.volumes.secrets.enabled }}
        - name: {{ .Values.volumes.secrets.name }}
          secret:
            secretName: {{ .Values.volumes.secrets.secretName | default (printf "%s-secret" (include "mychart.fullname" .)) }}
        {{- end }}
        {{- if .Values.volumes.config.enabled }}
        - name: {{ .Values.volumes.config.name }}
          configMap:
            name: {{ .Values.volumes.config.configMapName | default (printf "%s-config" (include "mychart.fullname" .)) }}
        {{- end }}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 40
        - pause: { duration: 30s }
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }
{{- end }}