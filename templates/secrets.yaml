{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mychart.fullname" . }}-secret
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.mountAsFiles }}
data:
  {{- $environment := .Values.global.environment | default "default" }}
  {{- $secretFile := printf "secrets/%s.json" $environment }}
  {{- if .Files.Get $secretFile }}
  secrets.json: {{ .Files.Get $secretFile | b64enc }}
  {{- else }}
  secrets.json: {{ .Files.Get "secrets/default.json" | default "{}" | b64enc }}
  {{- end }}
{{- else }}
data:
  {{- $environment := .Values.global.environment | default "default" }}
  {{- $secretFile := printf "secrets/%s.json" $environment }}
  {{- if .Files.Get $secretFile }}
    {{- $raw := .Files.Get $secretFile }}
    {{- $secrets := fromJson $raw }}
    {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | b64enc }}
    {{- end }}
  {{- else if .Values.secrets.data }}
    {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
    {{- end }}
  {{- else }}
  # No secrets provided
  {{- end }}
{{- end }}
{{- end }}