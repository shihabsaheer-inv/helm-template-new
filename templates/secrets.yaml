{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mychart.fullname" . }}-secret
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.secrets.mountAsFiles }}
data:
  {{- range $path, $_ := .Files.Glob "files/secrets/*" }}
    {{- $filename := base $path }}
  {{ $filename }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
{{- else }}
data:
  {{- $environment := .Values.global.environment | default "default" }}
  {{- $secretsFound := false }}
  
  {{- /* Try to find and parse environment-specific or default JSON secret files */ -}}
  {{- range $path, $_ := .Files.Glob "files/secrets/*.json" }}
    {{- $filename := base $path }}
    {{- $filenameWithoutExt := trimSuffix ".json" $filename }}
    {{- if or (eq $filenameWithoutExt $environment) (eq $filenameWithoutExt "default") }}
      {{- $raw := $.Files.Get $path }}
      {{- if $raw }}
        {{- $secrets := fromJson $raw }}
        {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | b64enc }}
        {{- end }}
        {{- $secretsFound = true }}
      {{- end }}
    {{- end }}
  {{- end }}
  
  {{- /* Fallback to .Values.secrets.data if no files found */ -}}
  {{- if and (not $secretsFound) .Values.secrets.data }}
    {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc }}
    {{- end }}
  {{- else if not $secretsFound }}
  # No secrets provided
  {{- end }}
{{- end }}
{{- end }}