{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mychart.fullname" . }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mychart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mychart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "mychart.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}

          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}

          {{- if and .Values.probes.readiness.enabled .Values.probes.readiness.path }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}

          {{- if and .Values.probes.liveness.enabled .Values.probes.liveness.path }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}

          {{- if or (and .Values.config.enabled (not .Values.config.mountAsFiles)) (and .Values.secrets.enabled (not .Values.secrets.mountAsFiles)) }}
          envFrom:
            {{- if and .Values.config.enabled (not .Values.config.mountAsFiles) }}
            - configMapRef:
                name: {{ include "mychart.fullname" . }}-config
            {{- end }}
            {{- if and .Values.secrets.enabled (not .Values.secrets.mountAsFiles) }}
            - secretRef:
                name: {{ include "mychart.fullname" . }}-secret
            {{- end }}
          {{- end }}

          volumeMounts:
            {{- if and .Values.config.enabled .Values.config.mountAsFiles }}
            - name: config-volume
              mountPath: {{ .Values.config.mountPath | default "/etc/config" }}
              readOnly: true
            {{- end }}

            {{- if and .Values.secrets.enabled .Values.secrets.mountAsFiles }}
            - name: secrets-volume
              mountPath: {{ .Values.secrets.mountPath | default "/etc/secrets" }}
              readOnly: true
            {{- end }}

      volumes:
        {{- if and .Values.config.enabled .Values.config.mountAsFiles }}
        - name: config-volume
          configMap:
            name: {{ include "mychart.fullname" . }}-config
            items:
              {{- $env := .Values.global.environment | default "default" }}
              {{- $jsonFile := printf "config/%s.json" $env }}
              {{- if .Files.Get $jsonFile }}
              - key: config.json
                path: config.json
              {{- else if .Files.Get "config/default.json" }}
              - key: config.json
                path: config.json
              {{- end }}

              {{- $yamlFile := printf "config/%s.yaml" $env }}
              {{- if .Files.Get $yamlFile }}
              - key: config.yaml
                path: config.yaml
              {{- else if .Files.Get "config/default.yaml" }}
              - key: config.yaml
                path: config.yaml
              {{- end }}

              {{- $propsFile := printf "config/application-%s.properties" $env }}
              {{- if .Files.Get $propsFile }}
              - key: application.properties
                path: application.properties
              {{- else if .Files.Get "config/application.properties" }}
              - key: application.properties
                path: application.properties
              {{- end }}
        {{- end }}

        {{- if and .Values.secrets.enabled .Values.secrets.mountAsFiles }}
        - name: secrets-volume
          secret:
            secretName: {{ include "mychart.fullname" . }}-secret
            {{- if .Values.secrets.items }}
            items:
              {{- range .Values.secrets.items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
            {{- end }}
        {{- end }}
{{- end }}
