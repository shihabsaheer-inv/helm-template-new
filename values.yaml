# ========================================
# Global Configuration
# ========================================
global:
    appName: myapp
    environment: default
# ========================================
# Image Configuration
# ========================================
image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
# ========================================
# Replica Configuration
# ========================================
replicaCount: 1
# ========================================
# Deployment toggle
# ========================================
deployment:
    enabled: true
# ========================================
# Service Configuration
# ========================================
service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 80
# ========================================
# Ingress Configuration
# ========================================
ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
        - host: myapp.local
          paths:
            - path: /
              pathType: Prefix
    tls: []
# ========================================
# Horizontal Pod Autoscaler
# ========================================
autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    cpu:
        enabled: true
        targetPercentage: 80
    memory:
        enabled: false
        targetPercentage: 75
# ========================================
# Istio Configuration
# ========================================
istio:
    enabled: false
    gateway: my-gateway
    hosts:
        - myapp.local
    retries: 3
# ========================================
# Rollout Configuration (for Argo Rollouts)
# ========================================
rollout:
    enabled: false
    strategy: Canary
# ========================================
# ConfigMap Configuration
# ========================================
config:
    enabled: true
    # Mount as files (reads from config/{environment}.json|yaml|properties)
    mountAsFiles: false
    mountPath: /etc/config
    # If mountAsFiles is true, you can specify which files to mount
    items: []
    # Example:
    # items:
    #   - key: config.json
    #     path: app-config.json
    #   - key: config.yaml
    #     path: app-config.yaml
    # Traditional key-value pairs (used when mountAsFiles: false)
    data:
        ENABLE_FEATURE_X: "true"
        LOG_LEVEL: info
