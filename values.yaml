# ========================================
# CronJob Configuration
# ========================================
cronjob:
    enabled: false
    schedule: 0 * * * *
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    image:
        repository: busybox
        tag: latest
        pullPolicy: IfNotPresent
    command:
        - /bin/sh
        - -c
        - echo Hello from CronJob && date
    env:
        - name: ENVIRONMENT
          value: ENC[AES256_GCM,data:M0n3,iv:W1/s+rv8MbM2xzGq7F3ogk1eP5TD+GqneXBZepjwxaw=,tag:z/ujs7ejcenU5B9/z0X5aQ==,type:str]
        - name: LOG_LEVEL
          value: ENC[AES256_GCM,data:+L0e7g==,iv:eqhLLFlo8TFOkknC2r5+qImW9uzAZcNOxU5DSQSfiEc=,tag:2WEIkvRi4XJWZaPXAxHgXg==,type:str]
    resources:
        requests:
            cpu: 100m
            memory: 128Mi
        limits:
            cpu: 200m
            memory: 256Mi
# ========================================
# Resources (requests/limits)
# ========================================
resources:
    requests:
        cpu: 250m
        memory: 128Mi
    limits:
        cpu: 500m
        memory: 256Mi
# ========================================
# Probes (readiness / liveness)
# ========================================
probes:
    readiness:
        enabled: true
        path: /
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
    liveness:
        enabled: true
        path: /
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3
