# Global
global:
    appName: myapp
    environment: dev
# Image
image:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
replicaCount: 1
deployment:
    enabled: true
service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 80
ingress:
  hosts:
    - paths:
        - path: /frontend
          serviceName: nginx-frontend-myapp
          servicePort: 80
        - path: /backend
          serviceName: nginx-backend-myapp
          servicePort: 80

tls: []
autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    cpu:
        enabled: true
        targetPercentage: 80
    memory:
        enabled: false
        targetPercentage: 75
istio:
    enabled: false
    gateway: my-gateway
    hosts:
        - myapp.local
    retries: 3
rollout:
    enabled: true
    # `strategy` may be used by rollout template if needed
    strategy: Canary
# Config maps: dynamic driven from values
config:
    enabled: true
    # Files (relative to files/config/)
    files:
        - name: application.properties
          mountPath: /etc/app/application.properties
        - name: dev.json
          mountPath: /etc/config/dev.json
        - name: dev1.yaml
          mountPath: /etc/config/dev1.yaml
    # Optional inline key/value fallback (creates a separate default configmap)
    data:
        ENABLE_FEATURE_X: "true"
        LOG_LEVEL: info
# Secrets: dynamic driven from values
secrets:
    enabled: true
    # Files (relative to files/secrets/)
    files:
        - name: secrets.json
          mountPath: /etc/secrets/secrets.json
        - name: secrets1.json
          mountPath: /etc/secrets/secrets1.json
    # Optional inline secret key/values (will be base64-encoded in template)
    data:
        DB_PASSWORD: ZGVmYXVsdC1wYXNzd29yZA==
# CronJob
cronjob:
    enabled: false
    schedule: 0 * * * *
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    image:
        repository: busybox
        tag: latest
        pullPolicy: IfNotPresent
    command:
        - /bin/sh
        - -c
        - echo "Hello from CronJob" && date
    env:
        - name: ENVIRONMENT
          value: dev
        - name: LOG_LEVEL
          value: info
    resources:
        requests:
            cpu: 100m
            memory: 128Mi
        limits:
            cpu: 200m
            memory: 256Mi
# Resources
resources:
    requests:
        cpu: 250m
        memory: 128Mi
    limits:
        cpu: 500m
        memory: 256Mi
# Probes
probes:
    readiness:
        enabled: true
        path: /
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
    liveness:
        enabled: true
        path: /
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3
