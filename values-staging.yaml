# ========================================
# Development Environment Overrides
# ========================================
global:
    environment: staging
# ========================================
# Image Configuration
# Always pull the latest image for quick dev iterations
# ========================================
image:
    repository: nginx
    tag: latest
    pullPolicy: Always
# ========================================
# Service Configuration
# Use NodePort for easy local/external access in development
# ========================================
service:
    type: NodePort
    port: 80
    targetPort: 80
# ========================================
# ConfigMap Configuration
# Disabled for dev — can be enabled when config files are needed
# ========================================
config:
    enabled: false
    mountAsFiles: true
    items:
        - key: ENC[AES256_GCM,data:YTgDhfx9Sd4Y+OE=,iv:4dN2Oxo8P9fArzp9ZaES6CdNAdh2rPpzbxxeG+c3NLw=,tag:5OWoWRqGW75UlRobzmA+6g==,type:str]
          path: app-config.json
        - key: ENC[AES256_GCM,data:rX0VzqMrbLm8Kwg=,iv:VWJSB2mX1p9NGygcf+pU+bMOwT5y6lQTH0tKR6YRY10=,tag:i8oTshwOknIpt2O65aFkzA==,type:str]
          path: app-config.yaml
        - key: ENC[AES256_GCM,data:3tl6iwpYK5jI/mjuhLXple4Eor9j7A==,iv:+EIdheWBpXQHvtuarDSFL1gDqBjTe3MCKjmuosOvVt8=,tag:O0aR7FiA1TKX3KFPfEzBuw==,type:str]
          path: application.properties
# ========================================
# Secrets Configuration
# Disabled for dev — avoids secret mounting during local testing
# ========================================
secrets:
    enabled: ENC[AES256_GCM,data:yErhfM4=,iv:cmgKELOqbH+fUE/OeTIOWtXheJdJ6gxxkvRJmxWi02c=,tag:7BhLVFfnxXujOsXHIKJmhg==,type:bool]
    mountAsFiles: ENC[AES256_GCM,data:2peFBw==,iv:EKUAFafz9+/Awf+jyO/pFUdFLNynHGKsTWf5hhS1SFY=,tag:K7vb/VJaZYudsCo/nOh0XA==,type:bool]
    items:
        - key: ENC[AES256_GCM,data:v71faf2ADGijCgGz,iv:rWSGOU8PKZ7Bstyz6AS9+ZBWD0Z1qzADMmYh7tPcqzg=,tag:t1FDNYoURe0Gryjw/yDhPw==,type:str]
          path: ENC[AES256_GCM,data:Ja9JJvBwbVXlxYVCT38TDw==,iv:yz4VUe2k7E1cCK3+zGTXwCtWOJieUyBGI8rTZePT8Qc=,tag:9BI7doBoEtT4gkt2/liGJw==,type:str]
