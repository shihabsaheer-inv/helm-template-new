# ========================================
# Development Environment Overrides
# ========================================
global:
    environment: dev
# ========================================
# Image Configuration
# Always pull the latest image for quick dev iterations
# ========================================
image:
    repository: nginx
    tag: latest
    pullPolicy: Always
# ========================================
# Service Configuration
# Use NodePort for easy local/external access in development
# ========================================
service:
    type: NodePort
    port: 80
    targetPort: 80
# ========================================
# ConfigMap Configuration
# Disabled for dev — can be enabled when config files are needed
# ========================================
config:
    enabled: true
    mountAsFiles: true
    items:
        - key: ENC[AES256_GCM,data:mS9JOCLecaos/H4=,iv:4MbpawuP7gFxwZnmGCDkcLljyd41zRxOor2Aq1LNN/A=,tag:O2ZU+ezK/yQm5Y5zC+HQVA==,type:str]
          path: app-config.json
        - key: ENC[AES256_GCM,data:hQ7pu/48iWbAyMU=,iv:LHwM0DCfacnr4euG+gpARID8ouw3hkb+vgQYrofhlXs=,tag:eI3fAUNViMQ0+aCL4FoDsA==,type:str]
          path: app-config.yaml
        - key: ENC[AES256_GCM,data:IxA9nFkm6rJxzSGBP47EbkVhFM9SCA==,iv:lDTgNHwLBWScR1AuZ9agtNaxj3uxEG8poP74OqtBZNc=,tag:rakQHifE/SZj+VDDXTKI4w==,type:str]
          path: application.properties
# ========================================
# Secrets Configuration
# Disabled for dev — avoids secret mounting during local testing
# ========================================
secrets:
    enabled: ENC[AES256_GCM,data:w0gBQA==,iv:cJvLyYjBMo+p6t6DhV5Q4zZEkPJHZ1Ckdk6ikfr/Oxk=,tag:RKErXEO1ELI1FXiV7Chlog==,type:bool]
    mountAsFiles: ENC[AES256_GCM,data:E3X1+Q==,iv:gA384BgNn+cCuDaaT1wCrlaxw3U5K+lSvvfAjksYoA4=,tag:iBiNCbXqctmbKSQC10dqYw==,type:bool]
    items:
        - key: ENC[AES256_GCM,data:aXYTtMUfvLSbs6K/,iv:lDjONdJueqJwVwshV6rsmz6TQPRWqqw87NduMN2BJkM=,tag:5v2A13gMVRaJ4tK9Sl4PqQ==,type:str]
          path: ENC[AES256_GCM,data:kbwvemRLpD/bqt4xH5A1nw==,iv:PTKVkGvnYYA1LeswtjwrVp7sJSW5TS+i9Z7kjKBp8zI=,tag:fju9rEgs3q9fVh7R5pDeDg==,type:str]
