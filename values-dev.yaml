# ========================================
# Resource Limits (lighter for dev)
# Smaller CPU/memory footprint for local environments
# ========================================
resources:
    requests:
        cpu: 100m
        memory: 128Mi
    limits:
        cpu: 250m
        memory: 256Mi
# ========================================
# Probes Configuration
# Readiness and liveness probes disabled to simplify local testing
# ========================================
probes:
    readiness:
        enabled: false
    liveness:
        enabled: false
# ========================================
# Common Labels
# Adds identifying metadata for dev deployments
# ========================================
commonLabels:
    environment: dev
    team: backend
    cost-center: engineering
rollout:
    enabled: false
deployment:
    enabled: true
env:
